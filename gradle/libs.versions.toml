# WebNative Version Catalog — 依赖版本唯一来源
# 所有版本统一在此管理，build 文件只引用不写死
# 查询时间：2026-09-03（Google Maven / Maven Central 最新稳定版）

[versions]
# 构建工具
agp = "9.4.0"
kotlin = "2.4.10"
gradle = "9.7.1"

# SDK
compileSdk = "37"
minSdk = "31"
targetSdk = "37"

# 站点分享二维码（纯 Java core，无 GMS/android 传递依赖）
zxingCore = "3.5.4"

# 应用内扫码相机栈（谷歌推荐 CameraX；解码复用 zxing-core，无 GMS）
androidxCamera = "1.6.2"

# AndroidX
coreKtx = "1.19.0"
appcompat = "1.8.0"
material = "1.14.0"
activityCompose = "1.13.0"
composeBom = "2026.08.00"
lifecycleRuntimeKtx = "2.11.0"
webkit = "1.17.0"
profileInstaller = "1.4.1"
fragmentKtx = "1.9.0"
coreSplashscreen = "1.2.0"
datastore = "1.2.1"

# 统计页 favicon 主色提取（Palette 官方方案，稳定版）
palette = "1.0.0"

# 第三方
gson = "2.14.0"
jsoup = "1.23.2"
markwon = "4.6.2"

# 测试
coroutinesTest = "1.11.0"
junit = "4.13.2"
robolectric = "4.16.1"
mockitoCore = "5.23.0"
mockitoKotlin = "6.3.0"
androidxTestJunit = "1.3.0"
espresso = "3.7.0"
androidxTestRunner = "1.7.0"
androidxTestRules = "1.7.0"
orchestrator = "1.6.1"

[libraries]

zxing-core = { module = "com.google.zxing:core", version.ref = "zxingCore" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "androidxCamera" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "androidxCamera" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "androidxCamera" }
# AndroidX
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "webkit" }
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileInstaller" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragmentKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-palette-ktx = { group = "androidx.palette", name = "palette-ktx", version.ref = "palette" }

# 第三方
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
jsoup = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }
markwon = { group = "io.noties.markwon", name = "core", version.ref = "markwon" }

# 测试
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
mockito-core = { group = "org.mockito", name = "mockito-core", version.ref = "mockitoCore" }
mockito-kotlin = { group = "org.mockito.kotlin", name = "mockito-kotlin", version.ref = "mockitoKotlin" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "androidxTestRules" }
androidx-test-orchestrator = { group = "androidx.test", name = "orchestrator", version.ref = "orchestrator" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
