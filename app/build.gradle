plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
    // AGP 9 内置 Kotlin（built-in Kotlin），无需 kotlin-android / kotlin-kapt
}

android {
    namespace 'com.cylonid.nativealpha'
    compileSdk libs.versions.compileSdk.get().toInteger()

    // Release 签名：读根目录 key.properties（git-ignored）；无则回退 debug 签名
    def keystorePropertiesFile = rootProject.file("key.properties")
    def hasSigningConfig = keystorePropertiesFile.exists()
    def keystoreProperties = new Properties()
    if (hasSigningConfig) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }

    signingConfigs {
        release {
            if (hasSigningConfig) {
                storeFile = rootProject.file(keystoreProperties.getProperty("storeFile"))
                storePassword = keystoreProperties.getProperty("storePassword")
                keyAlias = keystoreProperties.getProperty("keyAlias")
                keyPassword = keystoreProperties.getProperty("keyPassword")
            }
        }
    }

    defaultConfig {
        applicationId "com.cylonid.nativealpha"
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
        versionCode 2133
        versionName "2.1.33"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testInstrumentationRunnerArguments clearPackageData: 'true'
        // 只保留中英双语
        resConfigs "en", "zh"

        // 只保留 arm64-v8a 原生库（现代设备 99%+ 都是 arm64，x86 仅模拟器）
        ndk {
            abiFilters += "arm64-v8a"
        }
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = hasSigningConfig ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            applicationIdSuffix = ".debug"
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
        execution 'ANDROIDX_TEST_ORCHESTRATOR'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }
}

// APK 产物命名：WebNative-<variant>-v<versionName>.apk（AGP 9 新 DSL，复制改名）
androidComponents {
    onVariants(selector().withBuildType("release")) { variant ->
        variant.outputs.forEach { output ->
            // 新版 AGP 的 output 命名在构建产物目录，此处保留默认命名，不做额外处理
        }
    }
}

dependencies {
    // AndroidX 核心
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.androidx.material
    implementation libs.androidx.core.splashscreen
    implementation libs.androidx.fragment.ktx
