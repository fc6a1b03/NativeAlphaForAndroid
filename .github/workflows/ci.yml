name: WebNative CI/CD

on:
  push:
    branches: [ main, dev ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**.md'
      - 'doc/**'
      - 'design-system/**'
  pull_request:
    branches: [ main, dev ]
    paths-ignore:
      - '**.md'
      - 'doc/**'
      - 'design-system/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============ 质量验证（push/PR） ============
  test:
    name: "🧪 Unit Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: "🎯 Setup Java 17"
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 合并为单次 Gradle 调用：避免多次 JVM/daemon 启动，任务间共享增量编译
      - name: "🧪 Test + Lint + Debug Build"
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon

  # ============ Release（tag v* 触发，自动签名） ============
  release:
    name: "🚀 Release APK + AAB"
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: "🎯 Setup Java 17"
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: "🔑 Setup Signing Keystore"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # 从 Secrets 注入 keystore 与 key.properties（不落仓库）
          echo "$KEYSTORE_BASE64" | base64 -d > webnative-release.keystore
          cat > key.properties << EOF
          storeFile=webnative-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          # 诊断：严格校验 keystore（不用管道——head 会吞掉 keytool 退出码）
          echo "--- keystore 诊断 ---"
          ls -la webnative-release.keystore
          if keytool -list -keystore webnative-release.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /tmp/kt.log 2>&1; then
            echo "✅ keystore 有效"
            head -8 /tmp/kt.log
          else
            echo "❌ keystore 校验失败（base64 内容或密码/alias 不对）"
            cat /tmp/kt.log
            exit 1
          fi
          echo "✅ Signing config injected"

      - name: "🏗️ Build Release APK + AAB"
        run: |
          # pipefail：管道返回 gradlew 真实退出码（否则 tee 会掩盖构建失败）
          set -o pipefail
          ./gradlew assembleRelease bundleRelease --no-daemon 2>&1 | tee /tmp/build.log

      # 失败时打印日志尾部（直接显示在 Actions 页面，方便排查）
      - name: "🔍 Print build log tail on failure"
        if: failure()
        run: |
          echo "===== build.log 尾部 50 行 ====="
          tail -50 /tmp/build.log 2>/dev/null || echo "(无日志)"

      - name: "📦 Upload build log on failure"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-log
          path: /tmp/build.log
          retention-days: 7

      - name: "📦 Organize Artifacts"
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          mkdir -p artifacts
          # 诊断：先列出实际产物（AGP 9 命名可能带变体后缀）
          echo "--- 实际产物 ---"
          find app/build/outputs -name "*.apk" -o -name "*.aab" | sort
          cp app/build/outputs/apk/release/app-release.apk artifacts/WebNative-${VERSION}.apk
          cp app/build/outputs/bundle/release/app-release.aab artifacts/WebNative-${VERSION}.aab
          ls -la artifacts/
          # ===== 自动生成 Release body（从 git 提交按类型分类，不再写死）=====
          # 上个 tag（无则用全部历史）
          PREV_TAG=$(git tag --sort=-version:refname | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then RANGE=""; else RANGE="${PREV_TAG}..${VERSION}"; fi
          echo "--- 变更范围: ${RANGE:-全部历史} ---"
          # 分类提取（宽松关键词匹配，兼容中文提交信息；去掉 hash 与类型前缀）
          FEATURES=$(git log --oneline $RANGE 2>/dev/null | grep -iE "feat|feature|新增|增加|支持|优化.*体验|重设计" | sed -E 's/^[0-9a-f]+ ([a-z]+: )?//' | head -12)
          FIXES=$(git log --oneline $RANGE 2>/dev/null | grep -iE "fix|bug|修复|崩溃|异常|遮挡|失效" | sed -E 's/^[0-9a-f]+ ([a-z]+: )?//' | head -12)
          PERFS=$(git log --oneline $RANGE 2>/dev/null | grep -iE "perf|optim|speed|fast|提速|加速|体积|内存" | sed -E 's/^[0-9a-f]+ ([a-z]+: )?//' | head -8)
          # 生成 body（全动态：版本号/统计/分类/提交记录，无固定文案）
          TOTAL_COMMITS=$(git log --oneline $RANGE 2>/dev/null | wc -l | tr -d ' ')
          TOTAL_FILES=$(git diff --stat $RANGE 2>/dev/null | tail -1 | grep -oE '[0-9]+ files? changed' | grep -oE '[0-9]+' | head -1)
          F_COUNT=$(echo "$FEATURES" | grep -c . || true)
          X_COUNT=$(echo "$FIXES" | grep -c . || true)
          P_COUNT=$(echo "$PERFS" | grep -c . || true)
          {
            echo "# WebNative ${VERSION}"
            echo ""
            echo "## 📊 本版本概览"
            echo "- 提交数：${TOTAL_COMMITS:-0}"
            echo "- 变更文件：${TOTAL_FILES:-0}"
            echo "- 亮点 ${F_COUNT:-0} · 修复 ${X_COUNT:-0} · 性能优化 ${P_COUNT:-0}"
            echo ""
            echo "## ✨ 本版本亮点"
            if [ -n "$FEATURES" ]; then echo "$FEATURES" | grep -v '^$' | sed 's/^/- /'; else echo "- 本版本无新增功能"; fi
            echo ""
            if [ -n "$PERFS" ]; then
              echo "## ⚡ 性能优化"
              echo "$PERFS" | grep -v '^$' | sed 's/^/- /'
              echo ""
            fi
            echo "## 🐛 修复"
            if [ -n "$FIXES" ]; then echo "$FIXES" | grep -v '^$' | sed 's/^/- /'; else echo "- 本版本无修复项"; fi
            echo ""
            echo "## 📝 变更记录"
            git log --oneline $RANGE 2>/dev/null | head -30 || echo "-"
          } > artifacts/release_body.md
          echo "--- release body 前 15 行 ---"
          head -15 artifacts/release_body.md

      - name: "🚀 Create GitHub Release"
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/WebNative-*.apk
            artifacts/WebNative-*.aab
          body_path: artifacts/release_body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
