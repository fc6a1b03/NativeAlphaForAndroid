name: WebNative CI/CD

on:
  push:
    branches: [ main, dev ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**.md'
      - 'doc/**'
      - 'design-system/**'
  pull_request:
    branches: [ main, dev ]
    paths-ignore:
      - '**.md'
      - 'doc/**'
      - 'design-system/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============ 质量验证（push/PR） ============
  test:
    name: "🧪 Unit Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v6

      - name: "🎯 Setup Java 17"
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 合并为单次 Gradle 调用：避免多次 JVM/daemon 启动，任务间共享增量编译
      - name: "🧪 Test + Lint + Debug Build"
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon

  # ============ Release（tag v* 触发，自动签名） ============
  release:
    name: "🚀 Release APK + AAB"
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v6

      - name: "🎯 Setup Java 17"
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: "🔑 Setup Signing Keystore"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # 从 Secrets 注入 keystore 与 key.properties（不落仓库）
          echo "$KEYSTORE_BASE64" | base64 -d > webnative-release.keystore
          cat > key.properties << EOF
          storeFile=webnative-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          # 诊断：校验 keystore 是否有效（alias/密码/指纹）
          echo "--- keystore 诊断 ---"
          ls -la webnative-release.keystore
          keytool -list -keystore webnative-release.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>&1 | head -10 || echo "❌ keystore 校验失败（base64 或密码不对）"
          echo "✅ Signing config injected"

      - name: "🏗️ Build Release APK + AAB"
        run: |
          # pipefail：管道返回 gradlew 真实退出码（否则 tee 会掩盖构建失败）
          set -o pipefail
          ./gradlew assembleRelease bundleRelease --no-daemon 2>&1 | tee /tmp/build.log

      - name: "📦 Upload build log on failure"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-log
          path: /tmp/build.log
          retention-days: 7

      - name: "📦 Organize Artifacts"
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          mkdir -p artifacts
          # 诊断：先列出实际产物（AGP 9 命名可能带变体后缀）
          echo "--- 实际产物 ---"
          find app/build/outputs -name "*.apk" -o -name "*.aab" | sort
          cp app/build/outputs/apk/release/app-release.apk artifacts/WebNative-${VERSION}.apk
          cp app/build/outputs/bundle/release/app-release.aab artifacts/WebNative-${VERSION}.aab
          ls -la artifacts/

      - name: "🚀 Create GitHub Release"
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
